name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags headless ./...

  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.0

      - name: Install Make
        run: choco install make -y --no-progress

      - name: Test
        run: make test

      - name: Build Windows executable
        run: make build

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.StartsWith("v")) {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "MSI ProductVersion must be numeric, got '$version'"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        run: |
          wix build build/windows/installer/Product.wxs `
            -arch x64 `
            -d ProductVersion=${{ steps.version.outputs.value }} `
            -d SourceDir="$PWD\build\bin" `
            -out "build\bin\INIreader-${{ steps.version.outputs.value }}-windows-x64.msi"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: INIreader-windows-x64-artifacts
          path: |
            build/bin/*.msi
            build/bin/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.msi
            build/bin/*.exe
