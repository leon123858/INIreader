<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INIreader</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f5f5f5;
    }
    h1 {
      margin-top: 0;
    }
    #controls {
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: left;
    }
    th {
      background: #eaeaea;
    }
    td[contenteditable="true"] {
      background-color: #fff;
    }
    .delete {
      background: #c62828;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
    }
    .delete:hover {
      background: #b71c1c;
    }
    #filename {
      font-weight: bold;
    }
    #save {
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>INIreader</h1>
  <div id="controls">
    <span>目前開啟的檔案: <span id="filename">(未載入)</span></span>
    <button id="open">開啟檔案</button>
    <button id="newfile">新建檔案</button>
    <button id="add">新增列</button>
    <button id="save">儲存</button>
    <button id="saveas">另存新檔</button>
  </div>
  <table id="inidata">
    <thead>
      <tr>
        <th>區段 (Section)</th>
        <th>鍵 (Key)</th>
        <th>值 (Value)</th>
        <th>註解 (Commented)</th>
        <th>操作 (Actions)</th>
      </tr>
    </thead>
    <tbody id="tablebody">
    </tbody>
  </table>
  <script>
    // Simple frontend script for INIreader.  This script calls Go methods bound
    // via Wails.  It populates a table with section/key/value rows and
    // allows editing, adding and deleting rows.  When the user clicks Save,
    // the data is collected and written back to the current file.

    async function loadData() {
      try {
        const filenameElem = document.getElementById('filename');
        const tableBody = document.getElementById('tablebody');
        // Get current file path from the backend
        const filepath = await window.backend.App.CurrentFile();
        filenameElem.textContent = filepath || '(未載入)';
        // Show or hide the "新建檔案" button depending on whether a file is loaded
        const newBtn = document.getElementById('newfile');
        if (!filepath) {
          newBtn.style.display = 'inline-block';
        } else {
          newBtn.style.display = 'none';
        }
        // Get lines from backend
        const lines = await window.backend.App.GetLines();
        tableBody.innerHTML = '';
        if (lines && Array.isArray(lines)) {
          lines.forEach(line => {
            const row = document.createElement('tr');
            // store original type on dataset for later use
            row.dataset.type = line.type;
            if (line.type === 'comment') {
              // For pure comment lines, section and key are empty and the value holds the comment text.
              // We disable editing of section/key and do not show a comment toggle since a comment line
              // is always commented. The comment itself remains editable.
              row.innerHTML =
                `<td class="section"></td>` +
                `<td class="key"></td>` +
                `<td contenteditable="true" class="value">${line.value || ''}</td>` +
                `<td></td>` +
                `<td><button class="delete">刪除</button></td>`;
            } else {
              // For section and key lines, allow editing and show a comment toggle.
              row.innerHTML =
                `<td contenteditable="true" class="section">${line.section || ''}</td>` +
                `<td contenteditable="true" class="key">${line.key || ''}</td>` +
                `<td contenteditable="true" class="value">${line.value || ''}</td>` +
                `<td><input type="checkbox" class="commented" ${line.commented ? 'checked' : ''}></td>` +
                `<td><button class="delete">刪除</button></td>`;
            }
            tableBody.appendChild(row);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Open file using native dialog
    document.getElementById('open').addEventListener('click', async () => {
      try {
        const result = await window.backend.App.OpenIni();
        if (result) {
          // Data loaded successfully; refresh the table
          loadData();
        }
      } catch (err) {
        console.error(err);
        alert('開啟檔案時發生錯誤: ' + err);
      }
    });

    // Create a new INI file when no file is loaded
    document.getElementById('newfile').addEventListener('click', async () => {
      try {
        // For a new file, start with an empty list of lines
        const emptyLines = [];
        await window.backend.App.SaveAsLines(emptyLines);
        alert('已建立新檔案');
        loadData();
      } catch (err) {
        console.error(err);
        alert('建立新檔案時發生錯誤: ' + err);
      }
    });

    // Add a new empty row to the table
    document.getElementById('add').addEventListener('click', () => {
      const tableBody = document.getElementById('tablebody');
      const row = document.createElement('tr');
      // default type is key for new entries
      row.dataset.type = 'key';
      row.innerHTML =
        `<td contenteditable="true" class="section"></td>` +
        `<td contenteditable="true" class="key"></td>` +
        `<td contenteditable="true" class="value"></td>` +
        `<td><input type="checkbox" class="commented"></td>` +
        `<td><button class="delete">刪除</button></td>`;
      tableBody.appendChild(row);
    });

    // Handle deletion of a row when clicking the Delete button
    document.getElementById('tablebody').addEventListener('click', (event) => {
      if (event.target.classList.contains('delete')) {
        const row = event.target.closest('tr');
        if (row) row.remove();
      }
    });

    // Save the current table lines back to the backend
    document.getElementById('save').addEventListener('click', async () => {
      try {
        const tableBody = document.getElementById('tablebody');
        const rows = tableBody.querySelectorAll('tr');
        const lines = [];
        rows.forEach(row => {
          const section = row.querySelector('.section').textContent.trim();
          const key = row.querySelector('.key').textContent.trim();
          const value = row.querySelector('.value').textContent;
          // Determine line type: use dataset if exists, otherwise infer from cell contents
          let type = row.dataset.type;
          if (!type) {
            // infer type based on contents
            if (section && !key && !value) {
              type = 'section';
            } else if (!section && !key && value) {
              type = 'comment';
            } else if (!section && !key && !value) {
              type = 'blank';
            } else {
              type = 'key';
            }
          }
          // Determine commented status. Comment lines are always commented and do not use the checkbox.
          let commented;
          if (type === 'comment') {
            commented = true;
          } else {
            commented = row.querySelector('.commented')?.checked || false;
          }
          // Build line object
          const line = {
            section: section,
            key: key,
            value: value,
            commented: commented,
            type: type
          };
          lines.push(line);
        });
        // Ensure a file is loaded
        const filepath = await window.backend.App.CurrentFile();
        if (!filepath) {
          alert('沒有載入檔案，無法儲存。');
          return;
        }
        await window.backend.App.SaveLines(lines);
        alert('已儲存');
        // Reload data to reflect changes and maintain order
        loadData();
      } catch (err) {
        console.error(err);
        alert('儲存時發生錯誤: ' + err);
      }
    });

    // Save As - open file dialog and write to chosen path
    document.getElementById('saveas').addEventListener('click', async () => {
      try {
        const tableBody = document.getElementById('tablebody');
        const rows = tableBody.querySelectorAll('tr');
        const lines = [];
        rows.forEach(row => {
          const section = row.querySelector('.section').textContent.trim();
          const key = row.querySelector('.key').textContent.trim();
          const value = row.querySelector('.value').textContent;
          let type = row.dataset.type;
          if (!type) {
            if (section && !key && !value) {
              type = 'section';
            } else if (!section && !key && value) {
              type = 'comment';
            } else if (!section && !key && !value) {
              type = 'blank';
            } else {
              type = 'key';
            }
          }
          // Determine commented status. Comment lines are always commented.
          let commented;
          if (type === 'comment') {
            commented = true;
          } else {
            commented = row.querySelector('.commented')?.checked || false;
          }
          const line = { section: section, key: key, value: value, commented: commented, type: type };
          lines.push(line);
        });
        if (lines.length === 0) {
          alert('沒有資料可儲存。');
          return;
        }
        await window.backend.App.SaveAsLines(lines);
        alert('已另存新檔');
        loadData();
      } catch (err) {
        console.error(err);
        alert('另存新檔時發生錯誤: ' + err);
      }
    });

    // Load data when the page is ready
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
